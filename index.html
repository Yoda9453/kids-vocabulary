const KEY='word-garden-school-weeks1-7-progress';
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){}
const learned=new Set(Array.isArray(saved.learned)?saved.learned:[]),review=new Set(Array.isArray(saved.review)?saved.review:[]);
let order=WORDS.map((_,i)=>i),position=0;
const $=id=>document.getElementById(id);
function persist(){try{localStorage.setItem(KEY,JSON.stringify({learned:[...learned],review:[...review]}))}catch(e){}}
function filter(){let mode=$('mode').value;return order.filter(i=>mode==='all'||(mode==='review'?review.has(WORDS[i].word):!learned.has(WORDS[i].word)))}
function render(){const items=filter();position=Math.min(position,Math.max(0,items.length-1));const current=items[position];if(current===undefined){$('emoji').textContent='🎉';$('word').textContent='All done!';$('counter').textContent='0 / 0';$('speak').disabled=true;$('hint').textContent='Try another practice mode.';}else{const w=WORDS[current];$('emoji').textContent=w.emoji;$('word').textContent=w.word;$('counter').textContent=`${position+1} / ${items.length}`;$('speak').disabled=false;$('hint').textContent=learned.has(w.word)?'⭐ Learned! Tap to listen again.':'Tap to hear the word';}$('know').disabled=current===undefined;$('practice').disabled=current===undefined;$('learnedCount').textContent=`${learned.size} words learned`;$('reviewCount').textContent=`${review.size} to review`;$('progressFill').style.width=`${learned.size/WORDS.length*100}%`;$('progress').setAttribute('aria-valuenow',String(Math.round(learned.size/WORDS.length*100)));}
function current(){const items=filter();return items.length?WORDS[items[position]]:null}
function advance(step){const n=filter().length;if(n){position=(position+step+n)%n;render()}}
function speak(){const w=current();if(!w)return;if(!('speechSynthesis' in window)){ $('hint').textContent='Speech is not supported in this browser.';return;}window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w.word);u.lang='en-US';u.rate=.82;u.pitch=1.02;const voices=window.speechSynthesis.getVoices();const english=voices.find(v=>v.lang.toLowerCase()==='en-us')||voices.find(v=>v.lang.toLowerCase().startsWith('en'));if(english)u.voice=english;window.speechSynthesis.speak(u)}
$('speak').addEventListener('click',speak);$('next').addEventListener('click',()=>advance(1));$('prev').addEventListener('click',()=>advance(-1));
$('know').addEventListener('click',()=>{const w=current();if(!w)return;learned.add(w.word);review.delete(w.word);persist();if($('mode').value!=='all')position=position%Math.max(1,filter().length);else advance(1);render()});
$('practice').addEventListener('click',()=>{const w=current();if(!w)return;review.add(w.word);learned.delete(w.word);persist();advance(1);render()});
$('mode').addEventListener('change',()=>{position=0;render()});
$('shuffle').addEventListener('click',()=>{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}position=0;render()});
document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT'||e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowRight')advance(1);if(e.key==='ArrowLeft')advance(-1);if(e.key===' '){e.preventDefault();speak()}});
render();
</script>
